name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mobile/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Get dependencies
        working-directory: mobile/neowallet-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/neowallet-app
        run: flutter analyze

      - name: Test
        working-directory: mobile/neowallet-app
        run: flutter test
