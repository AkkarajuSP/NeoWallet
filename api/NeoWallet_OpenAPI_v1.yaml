    get:
      summary: Get transactions with filtering
      operationId: getTransactions
      tags:
        - Transactions
      security:
        - bearerAuth: []
      parameters:
        - name: X-Family-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: filter[category]
          in: query
          schema:
            type: string
        - name: filter[type]
          in: query
          schema:
            type: string
            enum: [INCOME, EXPENSE, REFUND, ADJUSTMENT, TRANSFER_RECORD]
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [PLANNED, COMMITTED, PENDING, COMPLETED, FAILED, REVERSED]
        - name: filter[familyMemberId]
          in: query
          schema:
            type: string
            format: uuid
        - name: filter[amountFrom]
          in: query
          schema:
            type: number
            format: decimal
        - name: filter[amountTo]
          in: query
          schema:
            type: number
            format: decimal
        - name: filter[dateFrom]
          in: query
          schema:
            type: string
            format: date
        - name: filter[dateTo]
          in: query
          schema:
            type: string
            format: date
        - name: sort
          in: query
          schema:
            type: string
            example: createdAt:desc
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsResponse'
        '401':
          description: Invalid token
          content:
