spring:
  datasource:
    url: ${NEOWALLET_DB_URL}
    username: ${NEOWALLET_DB_USER}
    password: ${NEOWALLET_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${NEOWALLET_REDIS_HOST}
      port: ${NEOWALLET_REDIS_PORT}
      password: ${NEOWALLET_REDIS_PASSWORD}
      database: ${NEOWALLET_REDIS_DB:0}

logging:
  level:
    com.neowallet: INFO
    org.springframework.security: INFO
