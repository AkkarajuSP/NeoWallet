spring:
  datasource:
    url: ${NEOWALLET_TEST_DB_URL:jdbc:postgresql://localhost:5432/neowallet_test}
    username: ${NEOWALLET_TEST_DB_USER:neowallet}
    password: ${NEOWALLET_TEST_DB_PASSWORD:neowallet}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${NEOWALLET_REDIS_HOST:localhost}
      port: ${NEOWALLET_REDIS_PORT:6379}
      password: ${NEOWALLET_REDIS_PASSWORD:}
      database: 1

neowallet:
  auth:
    jwt-secret: dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLWhzMjU2
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  otp:
    provider: stub

logging:
  level:
    com.neowallet: DEBUG
    org.springframework.security: INFO
